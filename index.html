<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문장 이심전심 · 관리 화면</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap" style="max-width:1080px">
  <div class="card center" style="margin-bottom:16px">
    <div class="bigmsg">🧠 문장 이심전심</div>
    <h2>4개 반 동시 운영</h2>
    <p style="font-size:17px">서버 하나로 난초반 · 장미반 · 모란반 · 매화반을 각각 독립적으로 운영합니다.</p>

    <div class="qr-launch-card" style="max-width:760px;margin:18px auto 0;text-align:left">
      <div>
        <h2 style="margin:0 0 8px">📱 학생 공통 QR</h2>
        <p class="small">네 반 모두 이 QR 하나를 사용합니다.</p>
        <div class="urltext" id="commonUrl">불러오는 중...</div>
      </div>
      <div class="actions">
        <button class="btn primary big" id="openCommonQrBtn" type="button">QR 크게 띄우기</button>
        <a class="btn" href="/student-start.html" target="_blank">학생 반 선택 화면 열기</a>
      </div>
    </div>

    <div class="qr-modal hidden" id="commonQrModal" role="dialog" aria-modal="true" aria-labelledby="commonQrTitle">
      <div class="qr-modal-card">
        <div class="top">
          <div>
            <h1 id="commonQrTitle" style="margin-bottom:4px">📱 학생 공통 QR</h1>
            <div class="small">스캔 후 자기 반을 선택하세요.</div>
          </div>
          <button class="btn danger" id="closeCommonQrBtn" type="button">닫기 ✕</button>
        </div>
        <div class="center">
          <img id="commonQr" class="qr-modal-image" src="/qr" alt="학생 공통 접속 QR">
          <div class="urltext" id="commonQrUrlText" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <h2>👩‍🏫 교사용 반 선택</h2>
  <div class="roomcards" id="roomCards"><div class="card">반 정보를 불러오는 중...</div></div>
</div>
<script>
fetch('/api/rooms').then(r=>r.json()).then(data=>{
  document.querySelector('#commonUrl').textContent=data.studentStartUrl || '';document.querySelector('#commonQrUrlText').textContent=data.studentStartUrl || '';
  document.querySelector('#roomCards').innerHTML=data.rooms.map(room=>`
    <section class="card roomcard">
      <h2>${room.name}</h2><div class="count">${room.count}명</div>
      <div class="actions">
        <a class="btn primary" href="/teacher.html?room=${room.id}">👩‍🏫 교사용</a>
        <a class="btn good" href="/display.html?room=${room.id}" target="_blank">📺 전체 화면</a>
      </div>
    </section>`).join('');
}).catch(()=>document.querySelector('#roomCards').innerHTML='<div class="card">서버 정보를 불러오지 못했습니다.</div>');

document.querySelector('#openCommonQrBtn').addEventListener('click',()=>document.querySelector('#commonQrModal').classList.remove('hidden'));
document.querySelector('#closeCommonQrBtn').addEventListener('click',()=>document.querySelector('#commonQrModal').classList.add('hidden'));
document.querySelector('#commonQrModal').addEventListener('click',e=>{if(e.target===document.querySelector('#commonQrModal'))document.querySelector('#commonQrModal').classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#commonQrModal').classList.add('hidden')});
</script></body></html>
